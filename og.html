<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OG image source · 1200×630</title>
<style>
  @page { size: 1200px 630px; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #fbfaf8;
    color: #14161a;
    background-image:
      radial-gradient(760px 420px at 4% -24%, rgba(31, 107, 255, 0.18), transparent 62%),
      radial-gradient(720px 400px at 98% -18%, rgba(31, 117, 115, 0.16), transparent 62%);
    position: relative;
  }
  .frame {
    position: absolute; inset: 44px;
    border: 1px solid rgba(20, 22, 26, 0.10);
    border-radius: 28px;
    padding: 52px 60px;
    display: flex; flex-direction: column;
    background: rgba(255, 255, 255, 0.55);
  }
  .top { display: flex; align-items: center; gap: 14px; }
  .top img { width: 40px; height: 40px; }
  .top span { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
  .top em {
    margin-left: auto; font-style: normal; font-size: 15px;
    letter-spacing: 2.5px; color: #5d6470; text-transform: uppercase;
  }
  h1 {
    margin: 58px 0 0;
    font-size: 74px; line-height: 1.16; letter-spacing: -3px; font-weight: 800;
  }
  h1 b {
    font-weight: 800;
    background: linear-gradient(100deg, #1f6bff, #1f7573);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .bottom {
    margin-top: auto; display: flex; align-items: flex-end; gap: 14px;
    font-size: 21px; color: #5d6470;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 7px 16px 7px 9px; border-radius: 999px;
    background: #fff; border: 1px solid rgba(20, 22, 26, 0.10);
    font-size: 18px; color: #14161a; font-weight: 600;
  }
  .pill .dot { width: 10px; height: 10px; border-radius: 50%; }
  .url { margin-left: auto; font-size: 19px; color: #5d6470; }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <img src="assets/mark.svg" alt="">
      <span>Jianghui</span>
      <em>iOS · iPadOS · macOS</em>
    </div>
    <h1>两件小工具，<br>数据都留在<b>你</b>手里。</h1>
    <div class="bottom">
      <span class="pill"><span class="dot" style="background:#1f6bff"></span>Quileg HID</span>
      <span class="pill"><span class="dot" style="background:#1f7573"></span>孤云 Guyun</span>
      <span class="pill"><span class="dot" style="background:#ff7a29"></span>Quileg STM32</span>
      <span class="url">jianghui1974.github.io</span>
    </div>
  </div>
</body>
</html>
